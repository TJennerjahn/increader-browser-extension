openapi: 3.1.0
info:
  title: Increader Browser Capture API
  version: 0.1.0
  description: |
    Browser Capture uses the same authenticated User session as the normal
    Increader client. It adds exact Bookmark lookup and multipart page import;
    it does not define a separate pairing or credential protocol.
paths:
  /api/browser-capture/bookmarks/lookup:
    post:
      operationId: lookupBrowserCaptureBookmark
      summary: Find an owned Bookmark at the exact Capture Source URL
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCaptureBookmarkLookupRequest"
      responses:
        "200":
          description: Minimal owned Bookmark reference, when one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureBookmarkLookup"
        "400":
          description: Invalid or fragment-bearing Capture Source URL
        "401":
          description: Normal Increader authentication is required
  /api/browser-capture/captures:
    post:
      operationId: importBrowserCapturePackage
      summary: Import captured HTML and selected images
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties:
                type: string
                format: binary
              required:
                - manifest
                - document
              properties:
                manifest:
                  $ref: "#/components/schemas/BrowserCapturePackageManifest"
                document:
                  type: string
                  format: binary
                  description: UTF-8 inert top-level live DOM snapshot.
            encoding:
              manifest:
                contentType: application/json
              document:
                contentType: text/html;charset=utf-8
      responses:
        "201":
          description: A normal Bookmark was created
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
        "200":
          description: An existing Bookmark was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
        "400":
          description: The Capture Package is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureProblem"
        "401":
          description: Normal Increader authentication is required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: increader_auth
  schemas:
    BrowserCaptureBookmarkLookup:
      type: object
      additionalProperties: false
      required:
        - exists
      properties:
        exists:
          type: boolean
        bookmarkId:
          type: integer
        title:
          type: string
    BrowserCaptureBookmarkLookupRequest:
      type: object
      additionalProperties: false
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
          description: Fragment-free top-level HTTP(S) Capture Source URL.
    BrowserCapturePackageManifest:
      type: object
      required:
        - captureId
        - capturedAt
        - sourceUrl
        - baseUrl
        - document
        - producer
        - assets
      properties:
        captureId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
        baseUrl:
          type: string
          format: uri
          maxLength: 8192
        canonicalUrl:
          type: string
          format: uri
          maxLength: 8192
        title:
          type: string
          maxLength: 1024
        language:
          type: string
          maxLength: 35
          pattern: "^[A-Za-z0-9-]+$"
        document:
          $ref: "#/components/schemas/BrowserCaptureDocumentDigest"
        producer:
          $ref: "#/components/schemas/BrowserCaptureProducer"
        assets:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/BrowserCaptureAsset"
      additionalProperties: true
    BrowserCaptureAsset:
      oneOf:
        - $ref: "#/components/schemas/BrowserCaptureCapturedAsset"
        - $ref: "#/components/schemas/BrowserCaptureUnavailableAsset"
    BrowserCaptureCapturedAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceUrl
        - status
        - mediaType
        - bytes
        - sha256
      properties:
        id:
          type: string
          pattern: "^asset-[0-9]{4}$"
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
        status:
          type: string
          enum:
            - captured
        mediaType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/gif
            - image/webp
            - image/avif
        bytes:
          type: integer
          minimum: 1
          maximum: 8388608
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    BrowserCaptureUnavailableAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceUrl
        - status
        - reason
      properties:
        id:
          type: string
          pattern: "^asset-[0-9]{4}$"
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
        status:
          type: string
          enum:
            - unavailable
        reason:
          type: string
          enum:
            - acquisition_failed
            - timeout
            - unsupported_type
            - asset_too_large
            - binary_limit
            - aggregate_limit
    BrowserCaptureDocumentDigest:
      type: object
      additionalProperties: false
      required:
        - bytes
        - sha256
      properties:
        bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    BrowserCaptureProducer:
      type: object
      additionalProperties: false
      required:
        - extensionVersion
        - browser
      properties:
        extensionVersion:
          type: string
          minLength: 1
          maxLength: 128
        browser:
          type: string
          minLength: 1
          maxLength: 128
    BookmarkResponse:
      type: object
      required:
        - id
        - url
        - title
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        title:
          type: string
      additionalProperties: true
    BrowserCaptureProblem:
      type: object
      required:
        - title
        - status
        - code
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - capture_package_invalid
      additionalProperties: true
