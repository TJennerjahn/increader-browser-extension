openapi: 3.1.0
info:
  title: Increader Browser Capture Protocol
  version: unversioned
  description: |
    The additive wire contract shared by Increader Cloud, self-hosted
    deployments, and the Increader Browser Extension. `info.version` is
    OpenAPI metadata only: the Browser Capture Protocol and Capture Packages
    deliberately have no schema-version field or versioned URL.
paths:
  /api/browser-capture/discovery:
    get:
      operationId: discoverBrowserCapture
      summary: Discover Browser Capture support
      description: |
        Returns a public, non-User-specific description of this instance's
        Browser Capture compatibility and effective limits. This is not an
        operational health endpoint.
      security: []
      responses:
        "200":
          description: Compatible Browser Capture discovery document
          headers:
            Cache-Control:
              schema:
                type: string
              description: Discovery is returned with `no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureDiscovery"
  /api/browser-capture/pairing/approvals:
    post:
      operationId: approveBrowserCapturePairing
      summary: Approve one Browser Extension Installation
      description: |
        Uses the instance's existing Account Identity context to display and
        record explicit User approval. The Browser Extension receives only a
        five-minute, single-use authorization code. The requested instance
        origin must equal the receiving server's canonical request origin.
      security:
        - accountIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCapturePairingApprovalRequest"
      responses:
        "201":
          description: Single-use approval code bound to the exact request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserCapturePairingApproval"
        "400":
          description: Invalid pairing request
        "401":
          description: Account Identity authentication is required
        "503":
          description: Browser Capture Pairing is unavailable
  /api/browser-capture/pairing/exchange:
    post:
      operationId: exchangeBrowserCapturePairingCode
      summary: Establish a pairing with a PKCE-bound approval code
      description: |
        This token operation ignores Account Identity cookies. The code,
        verifier, instance, callback, state, and installation must match the
        approved request exactly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCapturePairingExchange"
      responses:
        "200":
          description: Capture-scoped credentials for the paired installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserCapturePairingCredentials"
        "401":
          description: Invalid, expired, used, or incorrectly bound code
  /api/browser-capture/pairing/renew:
    post:
      operationId: renewBrowserCapturePairing
      summary: Rotate a pairing's renewal credential on demand
      description: |
        This token operation ignores Account Identity cookies. Successful
        renewal rotates the opaque credential and restarts its 90-day
        inactivity window.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCapturePairingRenewal"
      responses:
        "200":
          description: Rotated renewal credential and ten-minute access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserCapturePairingCredentials"
        "401":
          description: Invalid, expired, replayed, or incorrectly bound credential
  /api/browser-capture/pairing/revoke:
    post:
      operationId: disconnectBrowserCapturePairing
      summary: Revoke the calling Browser Extension Installation
      description: This token operation ignores Account Identity cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCapturePairingRenewal"
      responses:
        "204":
          description: Pairing revoked
        "401":
          description: Invalid or incorrectly bound credential
  /api/browser-capture/bookmarks/lookup:
    post:
      operationId: lookupBrowserCaptureBookmark
      summary: Find an owned Bookmark at the exact Capture Source URL
      description: |
        Performs one User-scoped exact-string URL lookup through the calling
        Browser Capture Pairing. This is not library search and does not apply
        canonical, redirect, tracking-parameter, or other URL equivalence.
      security:
        - browserCaptureAccess: []
      requestBody:
        required: true
        description: |
          Minimal request body keeps the publisher URL out of request targets
          and ordinary proxy/access logs.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCaptureBookmarkLookupRequest"
      responses:
        "200":
          description: Minimal owned Bookmark reference, when one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureBookmarkLookup"
        "400":
          description: Invalid or fragment-bearing Capture Source URL
        "401":
          description: Invalid or expired Browser Capture Access Token
  /api/browser-capture/captures:
    post:
      operationId: importBrowserCapturePackage
      summary: Import one immutable Capture Package
      description: |
        Accepts one atomic Capture Package from the calling Pairing. Captured
        binary asset parts use their Capture Asset ID as the multipart field
        name. The Capture Source URL remains Bookmark identity while canonical
        and base URLs are metadata/resolution hints. Capture ID idempotency is
        scoped to the paired User and logical package fingerprint. The encoded
        multipart request must have a fixed Content-Length no greater than
        64 MiB and must not use a non-identity Content-Encoding.
      security:
        - browserCaptureAccess: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties:
                type: string
                format: binary
                description: Raw captured image bytes keyed by Capture Asset ID.
              required:
                - manifest
                - document
              properties:
                manifest:
                  $ref: "#/components/schemas/BrowserCapturePackageManifest"
                document:
                  type: string
                  format: binary
                  description: UTF-8 inert top-level live DOM snapshot.
            encoding:
              manifest:
                contentType: application/json
              document:
                contentType: text/html;charset=utf-8
      responses:
        "201":
          description: A normal Bookmark was created
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
        "200":
          description: The normal existing Bookmark outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
        "400":
          description: The complete Capture Package is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureProblem"
        "401":
          description: Invalid or expired Browser Capture Access Token
        "409":
          description: Capture ID was used for different logical content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureProblem"
        "413":
          description: Encoded multipart request exceeds 64 MiB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureProblem"
        "429":
          description: Browser Capture transfer concurrency or rate limit
          headers:
            Retry-After:
              required: true
              description: Bounded whole seconds before an explicit Retry.
              schema:
                type: integer
                minimum: 1
                maximum: 3600
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BrowserCaptureProblem"
  /api/browser-capture/pairings:
    get:
      operationId: listBrowserCapturePairings
      summary: List the current User's paired installations
      security:
        - accountIdentity: []
      responses:
        "200":
          description: Active Browser Extension Installations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrowserCapturePairingSummary"
    delete:
      operationId: revokeAllBrowserCapturePairings
      summary: Revoke all paired installations for the current User
      security:
        - accountIdentity: []
      responses:
        "204":
          description: All pairings revoked
  /api/browser-capture/pairings/{pairingId}:
    delete:
      operationId: revokeBrowserCapturePairing
      summary: Revoke one paired installation owned by the current User
      security:
        - accountIdentity: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pairing revoked or already absent
components:
  securitySchemes:
    accountIdentity:
      type: http
      scheme: bearer
      description: |
        Existing Cloud or self-hosted Account Identity authentication. The
        approval and account-management operations also use the build
        variant's normal same-origin web session.
    browserCaptureAccess:
      type: http
      scheme: bearer
      bearerFormat: opaque-bca
      description: |
        Short-lived Browser Capture Access Token. It is resolved only by
        Browser Capture operations and grants no general Increader API access.
  schemas:
    BrowserCapturePairingApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - instanceOrigin
        - installationId
        - installationName
        - callbackUri
        - state
        - codeChallenge
        - codeChallengeMethod
      properties:
        instanceOrigin:
          type: string
          format: uri
          maxLength: 2048
        installationId:
          type: string
          format: uuid
        installationName:
          type: string
          minLength: 1
          maxLength: 120
        callbackUri:
          type: string
          format: uri
          maxLength: 2048
        state:
          type: string
          pattern: "^[A-Za-z0-9._~-]{32,128}$"
        codeChallenge:
          type: string
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
        codeChallengeMethod:
          type: string
          const: S256
    BrowserCapturePairingApproval:
      type: object
      additionalProperties: false
      required:
        - authorizationCode
        - callbackUri
        - state
      properties:
        authorizationCode:
          type: string
          pattern: "^bcc_[A-Za-z0-9_-]+$"
        callbackUri:
          type: string
          format: uri
        state:
          type: string
    BrowserCapturePairingExchange:
      type: object
      additionalProperties: false
      required:
        - authorizationCode
        - codeVerifier
        - instanceOrigin
        - installationId
        - callbackUri
        - state
      properties:
        authorizationCode:
          type: string
          pattern: "^bcc_[A-Za-z0-9_-]+$"
        codeVerifier:
          type: string
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
        instanceOrigin:
          type: string
          format: uri
        installationId:
          type: string
          format: uuid
        callbackUri:
          type: string
          format: uri
        state:
          type: string
    BrowserCapturePairingRenewal:
      type: object
      additionalProperties: false
      required:
        - renewalCredential
        - installationId
        - instanceOrigin
      properties:
        renewalCredential:
          type: string
          pattern: "^bcr_[A-Za-z0-9_-]+$"
        installationId:
          type: string
          format: uuid
        instanceOrigin:
          type: string
          format: uri
    BrowserCapturePairingCredentials:
      type: object
      additionalProperties: false
      required:
        - tokenType
        - accessToken
        - expiresInSeconds
        - renewalCredential
        - renewalExpiresInSeconds
        - pairingId
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          pattern: "^bca_[A-Za-z0-9_-]+$"
        expiresInSeconds:
          type: integer
          const: 600
        renewalCredential:
          type: string
          pattern: "^bcr_[A-Za-z0-9_-]+$"
        renewalExpiresInSeconds:
          type: integer
          const: 7776000
        pairingId:
          type: string
          format: uuid
    BrowserCapturePairingSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - installationId
        - installationName
        - instanceOrigin
        - createdAt
        - lastRenewedAt
      properties:
        id:
          type: string
          format: uuid
        installationId:
          type: string
          format: uuid
        installationName:
          type: string
        instanceOrigin:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        lastRenewedAt:
          type: string
          format: date-time
    BrowserCaptureBookmarkLookup:
      type: object
      additionalProperties: false
      required:
        - exists
      properties:
        exists:
          type: boolean
        bookmarkId:
          type: integer
          description: Present only for an owned Bookmark at the exact URL.
        title:
          type: string
          description: Present only when the existing owned Bookmark has a title.
    BrowserCaptureBookmarkLookupRequest:
      type: object
      additionalProperties: false
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
          description: Fragment-free top-level HTTP(S) Capture Source URL.
    BrowserCapturePackageManifest:
      type: object
      required:
        - captureId
        - capturedAt
        - sourceUrl
        - baseUrl
        - document
        - producer
        - assets
      properties:
        captureId:
          type: string
          format: uuid
          description: Globally unique identity allocated for one Import authorization.
        capturedAt:
          type: string
          format: date-time
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
          description: Final fragment-free top-level HTTP(S) Bookmark identity.
        baseUrl:
          type: string
          format: uri
          maxLength: 8192
          description: Absolute HTTP(S) base used only to resolve captured references.
        canonicalUrl:
          type: string
          format: uri
          maxLength: 8192
          description: Optional validated publisher hint; never Bookmark identity.
        title:
          type: string
          maxLength: 1024
          description: Observed fallback hint; Article Extraction remains authoritative.
        language:
          type: string
          maxLength: 35
          pattern: "^[A-Za-z0-9-]+$"
        document:
          $ref: "#/components/schemas/BrowserCaptureDocumentDigest"
        producer:
          $ref: "#/components/schemas/BrowserCaptureProducer"
        assets:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/BrowserCaptureAsset"
          description: |
            Ordered by the first corresponding opaque marker in the document.
            Repeated markers may reference one record. Every record must be
            referenced and captured records require one same-ID binary part.
      additionalProperties: true
    BrowserCaptureAsset:
      oneOf:
        - $ref: "#/components/schemas/BrowserCaptureCapturedAsset"
        - $ref: "#/components/schemas/BrowserCaptureUnavailableAsset"
    BrowserCaptureCapturedAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceUrl
        - status
        - mediaType
        - bytes
        - sha256
      properties:
        id:
          type: string
          pattern: "^asset-[0-9]{4}$"
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
          description: |
            Resolved selected image provenance. Captured data images use the
            bounded non-replayable value `data:`.
        status:
          type: string
          enum:
            - captured
        mediaType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/gif
            - image/webp
            - image/avif
        bytes:
          type: integer
          minimum: 1
          maximum: 8388608
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    BrowserCaptureUnavailableAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceUrl
        - status
        - reason
      properties:
        id:
          type: string
          pattern: "^asset-[0-9]{4}$"
        sourceUrl:
          type: string
          format: uri
          maxLength: 8192
          description: |
            Resolved selected image provenance. Non-replayable data images use
            `data:` and blob images retain their bounded blob URL.
        status:
          type: string
          enum:
            - unavailable
        reason:
          type: string
          enum:
            - acquisition_failed
            - timeout
            - unsupported_type
            - asset_too_large
            - binary_limit
            - aggregate_limit
    BrowserCaptureDocumentDigest:
      type: object
      additionalProperties: false
      required:
        - bytes
        - sha256
      properties:
        bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    BrowserCaptureProducer:
      type: object
      additionalProperties: false
      required:
        - extensionVersion
        - browser
      properties:
        extensionVersion:
          type: string
          minLength: 1
          maxLength: 128
        browser:
          type: string
          minLength: 1
          maxLength: 128
    BookmarkResponse:
      type: object
      required:
        - id
        - url
        - title
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        title:
          type: string
      additionalProperties: true
      description: Existing normal Increader BookmarkResponse; no Capture metadata.
    BrowserCaptureProblem:
      type: object
      required:
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - capture_package_invalid
            - capture_id_conflict
            - capture_request_too_large
            - capture_content_length_required
            - capture_transfer_limited
      additionalProperties: true
    BrowserCaptureDiscovery:
      type: object
      required:
        - protocol
        - displayName
        - pairingAvailable
        - capabilities
        - limits
      properties:
        protocol:
          type: string
          const: increader-browser-capture
          description: Stable protocol identity, not a schema version.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Safe instance label suitable for compact extension UI.
        pairingAvailable:
          type: boolean
          description: Whether this instance currently accepts new pairings.
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            description: |
              Capability name. Known base capabilities are shown as examples;
              additional names are additive and must be tolerated.
            examples:
              - pairing
              - bookmark-lookup
              - capture-package
          description: Additive Browser Capture operations advertised by the instance.
        limits:
          $ref: "#/components/schemas/BrowserCaptureLimits"
      additionalProperties: true
    BrowserCaptureLimits:
      type: object
      required:
        - multipartRequestBytes
        - manifestBytes
        - documentHtmlBytes
        - domElements
        - assetRecords
        - binaryAssets
        - assetBytes
        - aggregateAssetBytes
        - urlBytes
        - titleCodePoints
        - languageTagCharacters
        - producerFieldCodePoints
        - contentScriptChunkBytes
        - assetReadConcurrency
        - assetTimeoutMilliseconds
        - captureDeadlineMilliseconds
        - transferDeadlineMilliseconds
        - inFlightTransfersPerPairing
        - inFlightTransfersPerUser
        - transferAttemptsPerUserHour
        - idempotencyRetentionDays
      properties:
        multipartRequestBytes:
          type: integer
          format: int64
          minimum: 1
        manifestBytes:
          type: integer
          format: int64
          minimum: 1
        documentHtmlBytes:
          type: integer
          format: int64
          minimum: 1
        domElements:
          type: integer
          minimum: 1
        assetRecords:
          type: integer
          minimum: 0
        binaryAssets:
          type: integer
          minimum: 0
        assetBytes:
          type: integer
          format: int64
          minimum: 1
        aggregateAssetBytes:
          type: integer
          format: int64
          minimum: 0
        urlBytes:
          type: integer
          minimum: 1
        titleCodePoints:
          type: integer
          minimum: 1
        languageTagCharacters:
          type: integer
          minimum: 1
        producerFieldCodePoints:
          type: integer
          minimum: 1
        contentScriptChunkBytes:
          type: integer
          minimum: 1
        assetReadConcurrency:
          type: integer
          minimum: 1
        assetTimeoutMilliseconds:
          type: integer
          minimum: 1
        captureDeadlineMilliseconds:
          type: integer
          minimum: 1
        transferDeadlineMilliseconds:
          type: integer
          minimum: 1
        inFlightTransfersPerPairing:
          type: integer
          minimum: 1
        inFlightTransfersPerUser:
          type: integer
          minimum: 1
        transferAttemptsPerUserHour:
          type: integer
          minimum: 1
        idempotencyRetentionDays:
          type: integer
          minimum: 1
      additionalProperties: true
